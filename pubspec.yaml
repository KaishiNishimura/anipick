name: anipick
description: "iOS/Android向けAnnictクライアント"
publish_to: "none"
version: 1.0.0+1
environment:
  sdk: ^3.10.8

dependencies:
  adaptive_platform_ui: ^0.1.101
  crypto: ^3.0.3
  cupertino_icons: ^1.0.8
  flutter:
    sdk: flutter
  flutter_hooks: ^0.21.3+1
  flutter_launcher_icons: ^0.14.4
  flutter_riverpod: ^3.1.0
  flutter_secure_storage: ^10.0.0
  flutter_web_auth_2: ^5.0.1
  freezed: ^3.2.3
  hooks_riverpod: ^3.1.0
  http: ^1.2.2
  riverpod_annotation: ^4.0.0
  very_good_analysis: ^10.0.0

dev_dependencies:
  build_runner: ^2.4.13
  flutter_gen_runner: ^5.12.0
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  json_serializable: ^6.11.2
  riverpod_generator: ^4.0.0+1

flutter_gen:
  output: lib/gen/
  integrations:
    image: true

flutter:
  uses-material-design: true
  assets:
    - assets/images/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon.png"
  remove_alpha_ios: true
  adaptive_icon_foreground: "assets/icon/foreground.png"
  adaptive_icon_background: "#252032"
