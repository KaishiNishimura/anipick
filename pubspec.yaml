name: anipick
description: "iOS/Android向けAnnictクライアント"
publish_to: "none"
version: 1.0.0+1
environment:
  sdk: ^3.10.8

dependencies:
  crypto: ^3.0.3
  cupertino_icons: ^1.0.8
  flutter:
    sdk: flutter
  flutter_hooks: ^0.21.3+1
  flutter_riverpod: ^3.1.0
  flutter_secure_storage: ^10.0.0
  flutter_web_auth_2: ^5.0.1
  freezed: ^3.2.3
  hooks_riverpod: ^3.1.0
  http: ^1.2.2
  riverpod_annotation: ^4.0.0
  very_good_analysis: ^10.0.0

dev_dependencies:
  build_runner: ^2.4.13
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  json_serializable: ^6.11.2
  riverpod_generator: ^4.0.0+1

flutter:
  uses-material-design: true

  # 画像などのアセットを使う場合は有効化
  # assets:
  #   - assets/images/

  # カスタムフォントを使う場合はここに定義
  # fonts:
  #   - family: NotoSansJP
  #     fonts:
  #       - asset: assets/fonts/NotoSansJP-Regular.ttf
